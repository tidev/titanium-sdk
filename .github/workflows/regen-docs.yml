name: Regen Docs

# Tells titaniumsdk.com to recompile the SDK API docs.
#
# Fires on a change to apidoc/ and on a published release, rather than on every
# merged pull request, so a direct push to main is not missed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apidoc/**']
  release:
    types: [published]

jobs:
  lint:
    # Keeps forks from dispatching at the tidev site.
    if: github.repository_owner == 'tidev'
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint:docs

  # The dispatch itself lives in titanium-www so the payload shape is defined
  # once for all 17 source repos instead of copied into each.
  notify:
    needs: lint
    uses: tidev/titanium-www/.github/workflows/notify-api-docs.yml@main
    secrets:
      dispatch-token: ${{ secrets.REGEN_DOCS_GITHUB_TOKEN }}
