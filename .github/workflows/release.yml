name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to release from
        required: true
        default: main
      release-type:
        description: The type of release to perform
        required: true
        default: GA
        type: choice
        options:
          - GA
          - RC
          - RC2
          - RC3
          - RC4
          - Beta
          - Beta2
          - Beta3
          - Beta4
      release-notes:
        description: Open a release notes pull request against titaniumsdk.com
        required: false
        default: true
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate input parameters
    outputs:
      vtag: ${{ steps.vtag.outputs.vtag }}
      # 14.0.0 and 14_0_0_GA, for the jobs that talk to titaniumsdk.com.
      version: ${{ steps.vtag.outputs.version }}
      tag: ${{ steps.vtag.outputs.tag }}
    steps:
      # Releases come from main or a release branch, 14_0_X. The numbered form,
      # 13_2_0, is accepted too: one release branch was created that way by
      # mistake, and refusing it would strand anything still released from it.
      # Anything else is a typo or a feature branch, refused before it is built.
      - name: Validate branch
        env:
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          if ! [[ "$BRANCH" =~ ^(main|[0-9]+_[0-9]+_(X|[0-9]+))$ ]]; then
            echo "::error::'$BRANCH' is not a release branch: expected main, a branch like 14_0_X, or one like 13_2_0"
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}
      - name: Create version tag
        id: vtag
        run: |
          PACKAGE_VERSION=$(sed -n 's/^ *"version": *"//p' package.json | tr -d '"' | tr -d ',' | tr -d '[[:space:]]')
          VTAG="${PACKAGE_VERSION}.${{ github.event.inputs.release-type }}"
          echo "vtag=${VTAG}" >> $GITHUB_ENV
          echo "vtag=${VTAG}" >> $GITHUB_OUTPUT
          echo "version=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=$(echo "${VTAG}" | tr '.' '_')" >> $GITHUB_OUTPUT
      - name: Validate version
        uses: actions/github-script@v8
        env:
          vtag: ${{ env.vtag }}
        with:
          script: |
            const releaseMeta = github.rest.repos.listReleases.endpoint.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const releases = await github.paginate(releaseMeta);

            for (const release of releases) {
              if (release.name === process.env.vtag) {
                throw new Error(`${process.env.vtag} already exists`);
              }
            }
            console.log(`${process.env.vtag} does not exist so continuing`)

  android:
    runs-on: ubuntu-latest
    needs: [validate]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}
      - name: Android build
        uses: ./.github/actions/build-android
        with:
          node-version: '26'
          java-version: '21'

  ios:
    runs-on: macos-26
    name: iOS
    needs: [validate]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}
      - name: iOS build
        uses: ./.github/actions/build-ios
        with:
          node-version: '26'

  package:
    runs-on: macos-26
    name: Package
    env:
      SDK_BUILD_CACHE_DIR: ${{ github.workspace }}/.native-modules
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      vtag: ${{ needs.validate.outputs.vtag }}
    needs: [validate, android, ios]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.event.inputs.branch }}
    - name: Package
      uses: ./.github/actions/package
      with:
        node-version: '26'
        java-version: '21'
        vtag: ${{ env.vtag }}

  release:
    runs-on: ubuntu-latest
    name: Release
    environment: Release
    needs: [validate, package]
    env:
      vtag: ${{ needs.validate.outputs.vtag }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.event.inputs.branch }}
    - run: echo ${{ env.vtag }}
    - name: Download Linux artifact
      uses: actions/download-artifact@v8
      with:
        name: mobilesdk-${{ env.vtag }}-linux
    - name: Download macOS artifact
      uses: actions/download-artifact@v8
      with:
        name: mobilesdk-${{ env.vtag }}-osx
    - name: Download Windows artifact
      uses: actions/download-artifact@v8
      with:
        name: mobilesdk-${{ env.vtag }}-win32
    - name: Create and push tag
      run: |
        TAG_VERSION=$( echo ${{ env.vtag }} | tr '.' '_' )
        git config user.name "${GITHUB_ACTOR}"
        git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git tag "${TAG_VERSION}"
        git push origin "${TAG_VERSION}"
        echo "clean-tag=${TAG_VERSION}" >> $GITHUB_ENV
    - name: Upload SDK zips (GA)
      uses: softprops/action-gh-release@v3
      if: ${{ github.event.inputs.release-type == 'GA' }}
      with:
        files: mobilesdk-${{ env.vtag }}-*
        tag_name: ${{ env.clean-tag }}
        name: ${{ env.vtag }}
    - name: Upload SDK zips (non-GA)
      uses: softprops/action-gh-release@v3
      if: ${{ github.event.inputs.release-type != 'GA' }}
      with:
        files: mobilesdk-${{ env.vtag }}-*
        tag_name: ${{ env.clean-tag }}
        name: ${{ env.vtag }}
        prerelease: true
    - name: Bump version
      if: ${{ github.event.inputs.release-type == 'GA' }}
      run: |
        npm version patch --no-git-tag-version
        git add package.json
        git add package-lock.json
        git commit -m "chore(release): bump version"
        git push
    - name: Regen Builds (titaniumsdk.com)
      uses: peter-evans/repository-dispatch@v4
      with:
        event-type: regen-builds
        # Not the old name, tidev/titanium-www: a dispatch to a renamed
        # repository fails, and this step failing fails the job after the
        # release is already published, which skips the release-notes job.
        repository: tidev/titaniumsdk.com
        token: ${{ secrets.REGEN_BUILDS_DOCS_GITHUB_TOKEN }}

  # The release notes were made by hand: run the changelog, copy the section
  # out, edit the prose, add frontmatter, and open a pull request against the
  # docs repo. This does the mechanical half, and drafts the announcement.
  #
  # It runs as soon as the release starts, beside the builds, not after the
  # Release environment is approved. The note and the announcement are what
  # someone writes while the release waits, so they need to exist before it.
  # The pull request is opened as a GitHub draft, which cannot be merged:
  # merging publishes the note, and a release that is then rejected must not
  # have published one. `release-notes-ready` below turns it into a normal pull
  # request once the release has actually happened.
  #
  # Generated from the branch, not the tag: the tag does not exist until the
  # release job creates it. The branch's package.json names the version being
  # released, the same file `validate` read the version from, and the
  # changelog measures from the previous GA tag to the branch tip.
  #
  # GA only. A release candidate's notes were never published as pages.
  release-notes:
    runs-on: ubuntu-latest
    name: Release notes
    needs: [validate]
    if: ${{ inputs.release-notes && github.event.inputs.release-type == 'GA' }}
    env:
      vtag: ${{ needs.validate.outputs.vtag }}
      branch: release-notes/${{ needs.validate.outputs.vtag }}
    steps:
      - name: Checkout titaniumsdk.com
        uses: actions/checkout@v6
        with:
          repository: tidev/titaniumsdk.com
          path: titaniumsdk.com
          token: ${{ secrets.REGEN_BUILDS_DOCS_GITHUB_TOKEN }}

      # A re-run of this workflow - a build failed, the approval was rejected
      # and the release started again - must not regenerate a pull request that
      # someone has been editing. create-pull-request would update the existing
      # branch, replacing the edits with fresh output, so an existing branch
      # stops this job here instead.
      - name: Leave an existing pull request alone
        id: existing
        working-directory: titaniumsdk.com
        run: |
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "titaniumsdk.com already has $branch; leaving it as it is." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v6
        with:
          # Tags and full history: the changelog compares this release against
          # the previous one, and resolves that comparison through them.
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}
          path: titanium-sdk

      - name: Setup node
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: titanium-sdk/package-lock.json

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        working-directory: titanium-sdk
        run: npm ci --ignore-scripts

      - name: Generate the release note
        if: steps.existing.outputs.exists != 'true'
        working-directory: titanium-sdk
        run: |
          VERSION="${vtag%.GA}"
          node changelog/release-notes.js \
            --channel GA \
            --out "../titaniumsdk.com/registry/sdk/${VERSION}/release-notes.md"

      # The announcement can't be generated, but everything mechanical in it
      # can. The script lives in titaniumsdk.com, beside the template it fills,
      # and needs nothing installed. It writes the post as a draft with the
      # judgement calls marked, reads the thanks line from the note above, and
      # leaves a post that already exists alone.
      - name: Draft the release announcement
        if: steps.existing.outputs.exists != 'true'
        run: |
          VERSION="${vtag%.GA}"
          # The note's date, not today's. The note takes its date from the
          # CHANGELOG.md heading, which can be days before the run, and
          # release-notes-ready moves a date to the release day only where it
          # still matches the note's. The two have to start out equal for both
          # to be moved.
          DATE=$(sed -n 's/^date: *//p' "titaniumsdk.com/registry/sdk/${VERSION}/release-notes.md" | head -1)
          node titaniumsdk.com/scripts/new-release-post.ts --version "${VERSION}" ${DATE:+--date "$DATE"}

      - name: Open the pull request
        if: steps.existing.outputs.exists != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          path: titaniumsdk.com
          token: ${{ secrets.REGEN_BUILDS_DOCS_GITHUB_TOKEN }}
          branch: ${{ env.branch }}
          draft: true
          commit-message: "Add ${{ needs.validate.outputs.vtag }} release notes and a draft announcement"
          title: "Add ${{ needs.validate.outputs.vtag }} release notes and a draft announcement"
          body: |
            Generated by the SDK's release workflow for
            `${{ needs.validate.outputs.vtag }}`, as the release started.

            **This stays a draft until the release is approved.** Merging
            publishes the release note, so it cannot be merged before the SDK
            ships. When the release job succeeds, the workflow sets both files'
            dates to the release day and marks this ready. A rejected or
            cancelled release leaves it a draft.

            - **Release note** (`registry/sdk/.../release-notes.md`): generated
              from the changelog. Edit **About this release**, since the
              generator can only describe the release in general terms.
            - **Announcement** (`content/blog/sdk-...-ga.md`): a draft post.
              Merging does not publish it. Fill in every `TODO(release-post)`,
              run `node scripts/generate-social-posts.ts`, and set
              `draft: false`, here or in a later pull request.
              `docs/releases.md` has the steps.

            Edit freely: a re-run of the release workflow leaves this branch
            alone.

  # The SDK's API reference for the version just released, and with it the
  # toolchain, the compatibility page and - for a new major - the guides
  # snapshot, all done by titaniumsdk.com's Regen API Docs workflow.
  #
  # Called from here rather than left to regen-docs.yml's `release: published`
  # trigger, which never fires for these releases: the release above is
  # created with this run's GITHUB_TOKEN, and GitHub starts no workflow from an
  # event that token causes. The version is passed rather than read off a tag,
  # since this run's event is a workflow_dispatch.
  api-docs:
    name: Notify titaniumsdk.com of the release
    needs: [validate, release]
    if: ${{ github.event.inputs.release-type == 'GA' && github.repository_owner == 'tidev' }}
    uses: tidev/titaniumsdk.com/.github/workflows/notify-api-docs.yml@main
    with:
      ref: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
    secrets:
      dispatch-token: ${{ secrets.REGEN_BUILDS_DOCS_GITHUB_TOKEN }}

  # The release happened, so the release-notes pull request can be merged.
  #
  # Its dates were the day the release started, which is not the day it
  # shipped when the approval waits. Both are set to today, the release day,
  # and only where they still hold the date they were generated with, so a date
  # someone chose on purpose is left alone. Then the draft is marked ready.
  #
  # `always()` with explicit results rather than the default, so this still
  # runs when release-notes skipped its work because the pull request already
  # existed from an earlier run.
  release-notes-ready:
    runs-on: ubuntu-latest
    name: Mark the release notes ready
    needs: [validate, release, release-notes]
    if: ${{ always() && needs.release.result == 'success' && needs.release-notes.result == 'success' }}
    env:
      vtag: ${{ needs.validate.outputs.vtag }}
      branch: release-notes/${{ needs.validate.outputs.vtag }}
      GH_TOKEN: ${{ secrets.REGEN_BUILDS_DOCS_GITHUB_TOKEN }}
    steps:
      - name: Find the pull request
        id: pr
        run: |
          number=$(gh pr list -R tidev/titaniumsdk.com --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open pull request for $branch; nothing to mark ready." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Checkout the pull request
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v6
        with:
          repository: tidev/titaniumsdk.com
          ref: ${{ env.branch }}
          token: ${{ secrets.REGEN_BUILDS_DOCS_GITHUB_TOKEN }}

      - name: Date it the release day
        if: steps.pr.outputs.number != ''
        run: |
          set -euo pipefail
          VERSION="${vtag%.GA}"
          today=$(date -u +%Y-%m-%d)
          note="registry/sdk/${VERSION}/release-notes.md"
          post="content/blog/sdk-${VERSION//./-}-ga.md"
          # The date each file was generated with: the note's frontmatter, and
          # the post's, which the same run wrote on the same day.
          generated=$(sed -n 's/^date: *//p' "$note" | head -1)
          for f in "$note" "$post"; do
            [ -f "$f" ] || continue
            sed -i -E "s/^date: '?${generated}'?$/date: '${today}'/" "$f"
          done
          # The note's date is unquoted YAML; keep it that way.
          sed -i -E "s/^date: '(${today})'$/date: \1/" "$note"
          if git diff --quiet; then
            echo "Dates already the release day, or chosen by hand." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Date ${vtag} the day it was released"
          git push origin "HEAD:${branch}"

      - name: Mark it ready
        if: steps.pr.outputs.number != ''
        run: |
          gh pr ready "${{ steps.pr.outputs.number }}" -R tidev/titaniumsdk.com
          echo "titaniumsdk.com#${{ steps.pr.outputs.number }} is ready to merge." >> "$GITHUB_STEP_SUMMARY"
