plugins {
	id 'com.android.application'
}

// Keep this version equal to HERMES_TAG in "../spike/fetch-jsi.sh".
def hermesVersion = '250829098.0.19'
def runtimeDir = file('../../src/native')
def jsiDir = file('../../spike/app/src/main/cpp/third_party/jsi')

android {
	namespace = 'ti.harness'
	compileSdk = 36
	ndkVersion = '28.1.13356709'

	defaultConfig {
		applicationId = 'ti.hermes.harness'
		minSdk = 24
		targetSdk = 36
		versionCode = 1
		versionName = '0.0.1'
		ndk {
			abiFilters 'arm64-v8a', 'x86_64'
		}
		externalNativeBuild {
			cmake {
				arguments '-DANDROID_STL=c++_shared',
					"-DTI_HERMES_JSI_DIR=${jsiDir}",
					"-DTI_HERMES_GENERATED_DIR=${file('src/main/cpp/generated')}"
			}
		}
	}
	externalNativeBuild {
		cmake {
			path = new File(runtimeDir, 'CMakeLists.txt')
			version = '3.22.1'
		}
	}
	buildTypes {
		release {
			signingConfig = signingConfigs.debug
		}
	}
	buildFeatures {
		prefab = true
	}
	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}
}

dependencies {
	implementation "com.facebook.hermes:hermes-android:${hermesVersion}"
	implementation 'com.facebook.soloader:nativeloader:0.10.5'
}
