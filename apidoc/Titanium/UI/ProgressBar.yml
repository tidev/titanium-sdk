---
name: Titanium.UI.ProgressBar
summary: A progress bar.
description: |
    | Android | iOS |
    | ------- | --- |
    | ![Android](./progressbar_android.png) | ![iOS](./progressbar_ios.png) |

    A progress bar is used for displaying an ongoing activity with a defined progression.
    For an activity without a defined progression, you can use <Titanium.UI.ActivityIndicator>.

    Unlike most views, progress bars are hidden by default, so you must explicitly
    show the progress bar.

    Use the <Titanium.UI.createProgressBar> method or **`<ProgressBar>`** Alloy element to create a progress bar.

    #### Android Platform Notes

    In SDK 3.0, use <Titanium.UI.Android.ProgressIndicator> to display a progress indicator
    in a modal dialog or window title bar. Use `ProgressBar` to display the progress bar inside
    another view.

    #### iOS Platform Notes

    On iOS, to display the progress bar in the window title bar, assign the progress bar object
    to the window's [titleControl](Titanium.UI.Window.titleControl) property.
    Make sure the window is modal and not full screen, and that the navigation bar is not hidden.
extends: Titanium.UI.View
since: "0.8"
platforms: [android, iphone, ipad, macos]
excludes:
    properties: [children]
    methods: [add, remove, removeAllChildren, replaceAt]
properties:
  - name: animated
    summary: Enables smooth progress change animation when changing the value.
    type: Boolean
    default: true
    since: "10.0.1"

  - name: color
    summary: Color of the progress bar message, as a color name or hex triplet.
    description: |
        For information about color values, see the "Colors" section of <Titanium.UI>.
    type: [String, Titanium.UI.Color]

  - name: font
    summary: Font for the progress bar text.
    type: Font
    exclude-platforms: [android]

  - name: max
    summary: Maximum value of the progress bar.
    type: Number

  - name: message
    summary: Progress bar text.
    type: String

  - name: tintColor
    summary: The color shown for the portion of the progress bar that is filled.
    type: [String, Titanium.UI.Color]
    platforms: [iphone, ipad, android, macos]
    since: {iphone: "3.1.3", ipad: "3.1.3", android: "8.0.0"}

  - name: trackThickness
    summary: Thickness of the progress bar track.
    description: |
        Can be either a number (interpreted in the app's default unit) or a string with a
        unit suffix, for example `"8dp"`. The Material 3 theme default is `4dp`.

        This also defines the maximum size of the stop indicator dot
        (see <Titanium.UI.ProgressBar.stopIndicator>), which cannot be larger than the track.
    type: [Number, String]
    platforms: [android]
    since: "14.0.0"

  - name: trackTintColor
    summary: The color shown for the portion of the progress bar that is not filled.
    type: [String, Titanium.UI.Color]
    platforms: [iphone, ipad, android, macos]
    since: {iphone: "5.2.0", ipad: "5.2.0", android: "8.0.0"}

  - name: min
    summary: Minimum value of the progress bar.
    type: Number

  - name: stopIndicator
    summary: Shows, hides or configures the Material 3 stop indicator dot at the end of the track.
    description: |
        Material 3 themes render a small dot (the "stop indicator") at the trailing end of the
        progress bar track. Set this to `false` to hide it or `true` to show it with its default
        size. Alternatively, pass a <StopIndicatorOptions> dictionary to also set a custom size:

        ``` js
        progressBar.stopIndicator = { enabled: true, size: 12 };
        ```

        Note that the stop indicator cannot be larger than the track: Material clamps its size
        to the track thickness (`4dp` by default). To show a larger stop indicator, increase
        <Titanium.UI.ProgressBar.trackThickness> as well.
    type: [Boolean, StopIndicatorOptions]
    default: true
    platforms: [android]
    since: "14.0.0"

  - name: style
    summary: Style of the progress bar.
    description: For iOS, progress bar styles are constants defined in [ProgressBarStyle](Titanium.UI.iOS.ProgressBarStyle).
    type: Number
    platforms: [iphone,ipad, macos]

  - name: value
    summary: Current value of the progress bar.
    type: Number

examples:
  - title: Simple Progress Bar
    example: |
        In this example we create a progress bar with the min value of `0` and the max value
        of `10` and the current value of `0`. Changing the `value` property causes the
        displayed progress bar to update.

        ``` js
        var pb = Ti.UI.createProgressBar({
            top: 25,
            width: 250,
            min: 0,
            max: 10,
            value: 0,
            color: 'blue',
            message: 'Downloading 0 of 10',
            font: {fontSize: 14, fontWeight: 'bold'},
            style: Ti.UI.iOS.ProgressBarStyle.PLAIN,
        });
        var win = Ti.UI.createWindow({backgroundColor: 'white'});
        win.addEventListener('click', function(){
            if (pb.value < pb.max) {
                pb.message = 'Downloading '+ ++pb.value + ' of 10';
            }
        });
        win.add(pb);
        win.open();
        ```

  - title: Alloy XML Markup
    example: |
        Previous example as an Alloy view.

        index.xml:
        ``` xml
        <Alloy>
            <Window id="win" backgroundColor="white" onClick="incPB">
                <ProgressBar id="pb" />
            </Window>
        </Alloy>
        ```

        index.js:
        ``` js
        function incPB() {
            if ($.pb.value < $.pb.max) {
                $.pb.message = 'Downloading '+ ++$.pb.value + ' of 10';
            }
        }
        $.win.open();
        ```

        index.tss:
        ``` js
        "#pb": {
            top: 25,
            width: 250,
            min: 0,
            max: 10,
            value: 0,
            color: 'blue',
            message: 'Downloading 0 of 10',
            font: {fontSize:14, fontWeight:'bold'},
            style: Titanium.UI.iOS.ProgressBarStyle.PLAIN
        }
        ```
---
name: StopIndicatorOptions
summary: Dictionary of options for the <Titanium.UI.ProgressBar.stopIndicator> property.
platforms: [android]
since: "14.0.0"
properties:
  - name: enabled
    summary: Determines whether the stop indicator is shown.
    type: Boolean
    default: true

  - name: size
    summary: Custom size of the stop indicator. If not set, the default size is used.
    description: |
        Can be either a number (interpreted in the app's default unit) or a string with a
        unit suffix, for example `"4dp"`.

        The size is clamped to the track thickness, so values larger than
        <Titanium.UI.ProgressBar.trackThickness> (`4dp` by default) have no visible effect.
    type: [Number, String]
