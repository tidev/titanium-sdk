---
name: Titanium.UI.iOS.SplitWindow
summary: |
    A SplitWindow is a window that manages the presentation of two side-by-side view
    controllers.
description: |
    The [masterView](Titanium.UI.iOS.SplitWindow.masterView) and [detailView](Titanium.UI.iOS.SplitWindow.detailView)
    properties are required before the SplitWindow is opened.

    You use this class to implement a master-detail interface, in which the left-side view presents
    a list of items and the right-side presents details of the selected item. The `SplitWindow` is supported
    for both iPhone and iPad idioms. Use the <Titanium.UI.iOS.createSplitWindow> method to create a `SplitWindow` object.

    The `SplitWindow` is backed by the native `UISplitViewController` and uses its default behavior:

    * In a wide regular width, such as an iPad in landscape, the master view and the detail view are shown side by side.
    * In a narrower regular width, such as an iPad in portrait, the master view is hidden. The display mode button in the
      navigation bar of the detail view and a swipe from the leading edge show it as an overlay.
    * In a compact width, such as an iPhone in portrait, the split window collapses to a single column and the system
      navigates between the master view and the detail view.

    Use [displayMode](Titanium.UI.iOS.SplitWindow.displayMode) and [splitBehavior](Titanium.UI.iOS.SplitWindow.splitBehavior)
    to request a different arrangement, [showMasterView](Titanium.UI.iOS.SplitWindow.showMasterView) and
    [hideMasterView](Titanium.UI.iOS.SplitWindow.hideMasterView) to show or hide the master view, and
    [primaryColumnWidthFraction](Titanium.UI.iOS.SplitWindow.primaryColumnWidthFraction) to control its width.

    The system embeds each view in a navigation controller, so the `title` and the navigation bar properties of a
    <Titanium.UI.Window> apply directly. Set `navBarHidden` to `true` on a window to hide its navigation bar. Use a
    <Titanium.UI.NavigationWindow> as `masterView` or `detailView` to push windows inside a pane.

    The SplitWindow is a top-level window and cannot be contained within another window or view.
extends: Titanium.UI.Window
platforms: [iphone, ipad, macos]
since: {iphone: "3.6.0", ipad: "3.6.0", macos: "9.2.0"}
excludes:
    properties: [transitionAnimation, swipeToClose]
    methods: [setToolbar]
methods:
  - name: showMasterView
    summary: Shows the master view if the current display mode hides it.
    description: |
        The system animates the change and picks the display mode that fits the available width, for example an
        overlay in a narrow width. Listen to the [displaymodechange](Titanium.UI.iOS.SplitWindow.displaymodechange)
        event to react to the result.
    since: "14.0.0"

  - name: hideMasterView
    summary: Hides the master view if the current display mode shows it.
    description: |
        The system animates the change. Listen to the [displaymodechange](Titanium.UI.iOS.SplitWindow.displaymodechange)
        event to react to the result.
    since: "14.0.0"

  - name: setShowMasterInPortrait
    summary: Sets the value of the [showMasterInPortrait](Titanium.UI.iOS.SplitWindow.showMasterInPortrait) property.
    deprecated:
        since: "14.0.0"
        notes: The layout is owned by the system. Use <Titanium.UI.iOS.SplitWindow.displayMode> instead.
    parameters:
      - name: showMasterInPortrait
        summary: Determines whether to show the master view in portrait orientation.
        type: Boolean

      - name: options
        summary: Ignored.
        type: AnimatedOptions
        optional: true
        default: "{ animated: false }"

  - name: setMasterIsOverlayed
    summary: Sets the value of the [masterIsOverlayed](Titanium.UI.iOS.SplitWindow.masterIsOverlayed) property.
    deprecated:
        since: "14.0.0"
        notes: The layout is owned by the system. Use <Titanium.UI.iOS.SplitWindow.splitBehavior> instead.
    parameters:
      - name: masterIsOverlayed
        summary: Determines whether to show the master view is overlayed in portrait orientation.
        type: Boolean

      - name: options
        summary: Ignored.
        type: AnimatedOptions
        optional: true
        default: "{ animated: false }"

events:
  - name: displaymodechange
    summary: Fired before the split window changes its display mode, for example when the master view is shown or hidden.
    properties:
      - name: displayMode
        summary: The new display mode.
        type: Number
        constants: Titanium.UI.iOS.SPLIT_WINDOW_DISPLAY_MODE_*
    since: "14.0.0"

  - name: collapse
    summary: Fired when the split window collapses to a single column, for example when the width becomes compact.
    since: "14.0.0"

  - name: expand
    summary: Fired when the split window expands from a single column to two columns.
    since: "14.0.0"

properties:
  - name: detailView
    summary: Window for the detail view section of the SplitWindow.
    type: Titanium.UI.Window

  - name: masterView
    summary: Window for the master view section of the SplitWindow.
    type: Titanium.UI.Window

  - name: displayMode
    summary: The arrangement of the master view and the detail view.
    description: |
        Set one of the `SPLIT_WINDOW_DISPLAY_MODE_*` constants to request a display mode. The system applies the mode when
        the width allows it. Reading the property returns the display mode in use, which can differ from the requested
        one, for example in a compact width where the split window is collapsed.
    type: Number
    constants: Titanium.UI.iOS.SPLIT_WINDOW_DISPLAY_MODE_*
    default: <Titanium.UI.iOS.SPLIT_WINDOW_DISPLAY_MODE_AUTOMATIC>
    since: "14.0.0"

  - name: splitBehavior
    summary: How the master view and the detail view share the width when both are visible.
    description: |
        Set one of the `SPLIT_WINDOW_SPLIT_BEHAVIOR_*` constants to request a split behavior. Reading the property returns
        the split behavior in use, which can differ from the requested one.
    type: Number
    constants: Titanium.UI.iOS.SPLIT_WINDOW_SPLIT_BEHAVIOR_*
    default: <Titanium.UI.iOS.SPLIT_WINDOW_SPLIT_BEHAVIOR_AUTOMATIC>
    since: "14.0.0"

  - name: presentsWithGesture
    summary: Determines whether a swipe from the leading edge shows the hidden master view.
    type: Boolean
    default: true
    since: "14.0.0"

  - name: primaryColumnWidthFraction
    summary: The width of the master view as a fraction of the width of the split window.
    description: |
        The resulting width is limited by [minimumPrimaryColumnWidth](Titanium.UI.iOS.SplitWindow.minimumPrimaryColumnWidth)
        and [maximumPrimaryColumnWidth](Titanium.UI.iOS.SplitWindow.maximumPrimaryColumnWidth).
    type: Number
    default: System default
    since: "14.0.0"

  - name: minimumPrimaryColumnWidth
    summary: The minimum width of the master view in points.
    type: Number
    default: System default
    since: "14.0.0"

  - name: maximumPrimaryColumnWidth
    summary: The maximum width of the master view in points.
    type: Number
    default: System default
    since: "14.0.0"

  - name: showMasterInPortrait
    summary: Determines whether to show the master view in portrait orientation.
    deprecated:
        since: "14.0.0"
        notes: |
            The layout is owned by the system and this property has no effect. Use
            <Titanium.UI.iOS.SplitWindow.displayMode> with <Titanium.UI.iOS.SPLIT_WINDOW_DISPLAY_MODE_ONE_BESIDE_SECONDARY>
            to always show the master view.
    type: Boolean
    default: false

  - name: masterIsOverlayed
    summary: Determines whether to show the master view is overlayed in portrait orientation.
    deprecated:
        since: "14.0.0"
        notes: |
            The layout is owned by the system and this property has no effect. Use
            <Titanium.UI.iOS.SplitWindow.splitBehavior> with <Titanium.UI.iOS.SPLIT_WINDOW_SPLIT_BEHAVIOR_OVERLAY>.
    type: Boolean
    default: false

  - name: masterViewVisible
    summary: Determines whether to show the master view or hide.
    deprecated:
        since: "14.0.0"
        notes: |
            The layout is owned by the system and this property has no effect. Use
            <Titanium.UI.iOS.SplitWindow.showMasterView> and <Titanium.UI.iOS.SplitWindow.hideMasterView>.
    type: Boolean
    default: true

  - name: portraitSplit
    summary: Determines the width of the `masterView` in portrait mode.
    deprecated:
        since: "14.0.0"
        notes: |
            The layout is owned by the system and this property has no effect. Use
            <Titanium.UI.iOS.SplitWindow.primaryColumnWidthFraction>.
    type: Number
    default: The width of the master-view divided by the screen-width

  - name: landscapeSplit
    summary: Determines the width of the `masterView` in landscape mode.
    deprecated:
        since: "14.0.0"
        notes: |
            The layout is owned by the system and this property has no effect. Use
            <Titanium.UI.iOS.SplitWindow.primaryColumnWidthFraction>.
    type: Number
    default: The width of the master-view divided by the screen-height
